<div class="form-container">
  <h2>Registrar Paciente (Niño)</h2>
  <form (ngSubmit)="registrar()">
    <div class="form-group">
      <label>Nombre</label>
      <input [(ngModel)]="nombre" name="nombre" required />
    </div>
    <div class="form-group">
      <label>Apellido</label>
      <input [(ngModel)]="apellido" name="apellido" required />
    </div>
    <div class="form-group">
      <label>Fecha de nacimiento</label>
      <input type="date" [(ngModel)]="fechaNacimiento" name="fechaNacimiento" required />
    </div>
    <div class="form-group">
      <label>Género</label>
      <select [(ngModel)]="genero" name="genero">
        <option value="M">Masculino</option>
        <option value="F">Femenino</option>
      </select>
    </div>
    <div class="form-group">
      <label>Grupo sanguíneo</label>
      <input [(ngModel)]="grupoSanguineo" name="grupoSanguineo" />
    </div>
    <div class="form-group">
      <label>Alergias</label>
      <textarea [(ngModel)]="alergias" name="alergias"></textarea>
    </div>
    <button type="submit">Guardar</button>
    @if (mensaje) {
      <p class="mensaje">{{ mensaje }}</p>
    }
  </form>
</div>
