<div class="cita-form">
  <h2>Reservar Cita</h2>
  <p class="intro">Complete los datos para agendar una nueva cita.</p>

  <div class="form-group">
    <label>Paciente</label>
    <select [(ngModel)]="pacienteId" name="pacienteId">
      <option [ngValue]="null">-- Seleccione --</option>
      @for (p of pacientes; track p.idPaciente) {
        <option [ngValue]="p.idPaciente">{{ p.nombre }} {{ p.apellido }}</option>
      }
    </select>
  </div>

  <div class="form-group">
    <label>Especialidad</label>
    <select [(ngModel)]="especialidadId" name="especialidadId" (change)="cargarMedicos()">
      <option [ngValue]="null">-- Seleccione --</option>
      @for (e of especialidades; track e.idEspecialidad) {
        <option [ngValue]="e.idEspecialidad">{{ e.nombre }}</option>
      }
    </select>
  </div>

  <div class="form-group">
    <label>Médico</label>
    <select [(ngModel)]="medicoId" name="medicoId">
      <option [ngValue]="null">-- Seleccione --</option>
      @for (m of medicos; track m.idMedico) {
        <option [ngValue]="m.idMedico">Dr. {{ m.usuario?.nombre }} {{ m.usuario?.apellido }}</option>
      }
    </select>
  </div>

  <div class="form-group">
    <label>Fecha y hora</label>
    <input type="datetime-local" [(ngModel)]="fechaHora" name="fechaHora" />
  </div>

  <button class="btn-primario" (click)="reservar()">Reservar</button>

  @if (error) { <p class="error">{{ error }}</p> }
  @if (mensaje) { <p class="mensaje">{{ mensaje }}</p> }
</div>
