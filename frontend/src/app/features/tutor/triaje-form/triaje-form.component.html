<div class="triaje-container">
  <header class="section-header">
    <h2><i class="fas fa-notes-medical"></i> Triaje de Síntomas</h2>
    <p class="section-subtitle">Selecciona un paciente y los síntomas para obtener una recomendación</p>
  </header>

  <div class="form-group">
    <label>Paciente</label>
    <select [(ngModel)]="pacienteSeleccionado" name="paciente">
      <option [ngValue]="null">-- Seleccione --</option>
      @for (p of pacientes; track p.idPaciente) {
        <option [ngValue]="p.idPaciente">{{ p.nombre }} {{ p.apellido }}</option>
      }
    </select>
  </div>

  <div class="sintomas">
    <p class="sintomas-title">Síntomas</p>
    <div class="checkbox-grid">
      @for (s of sintomasDisponibles; track s.id) {
        <label class="checkbox-card">
          <input type="checkbox" (change)="toggleSintoma(s.id)" />
          <span>{{ s.nombre }}</span>
        </label>
      }
    </div>
  </div>

  <button class="submit-btn" (click)="realizarTriaje()">
    <i class="fas fa-stethoscope"></i> Obtener recomendación
  </button>

  @if (error) { <p class="mensaje-error"><i class="fas fa-exclamation-circle"></i> {{ error }}</p> }
  @if (resultado) {
    <div class="resultado-card">
      <h3><i class="fas fa-check-circle"></i> Especialidad recomendada</h3>
      <p class="especialidad">{{ resultado.especialidadRecomendada.nombre }}</p>
    </div>
  }
</div>
